name: Auto Bilibili Data Crawler

on:
  schedule:
    - cron: '0 16,0 * * *'
  workflow_dispatch:

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 Google Chrome 浏览器
        run: |
          sudo apt-get update
          sudo apt-get install -y wget google-chrome-stable

      - name: 无缓存安装 Python 依赖包
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir requests pandas openpyxl DrissionPage

      - name: 验证 DrissionPage 是否可用
        run: |
          python -c "import DrissionPage; print('DrissionPage 安装成功，版本:', DrissionPage.__version__)"

      - name: 运行数据采集脚本
        run: |
          python bili_auto_tracker.py

      - name: 自动提交并推送更新后的数据文件
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add *.xlsx *.csv || true
          git commit -m "Auto update daily report [skip ci]" || exit 0
          git push
