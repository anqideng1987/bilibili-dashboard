name: Bilibili Auto Crawler & Sync

on:
  schedule:
    # 每 30 分钟在云端运行一次
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
      - name: 检出云端仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl curl_cffi

      - name: 执行抓取脚本
        run: |
          python bili_auto_tracker.py

      - name: 自动将最新数据提交并推送到仓库
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add *.xlsx || true
          git commit -m "Auto update daily excel report [skip ci]" || exit 0
          git push
