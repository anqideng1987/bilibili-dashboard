name: Bilibili Auto Tracker

on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install DrissionPage pandas openpyxl requests

      - name: Run script
        run: python bili_auto_tracker.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 1. 暂存生成的报表文件
          git add *.xlsx *.csv || true
          
          # 2. 如果没有变化则退出
          git diff-index --quiet HEAD || git commit -m "Auto-update bilibili report data" || exit 0
          
          # 3. 先拉取远程最新提交，避免冲突
          git pull --rebase origin main
          
          # 4. 推送到远程主分支
          git push origin main
