name: Auto Bilibili Data Crawler

on:
  schedule:
    - cron: '50 11 * * *'
  workflow_dispatch:

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 Chrome 浏览器
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: 安装依赖包
        run: |
          python -m pip install --upgrade pip
          pip install requests curl_cffi pandas openpyxl DrissionPage streamlit

      - name: 运行数据采集脚本
        run: |
          if [ -f "app.py" ]; then
            python app.py
          elif [ -f "bili_report_generator.py" ]; then
            python bili_report_generator.py
          elif [ -f "app.py" ]; then
            python app.py
          else
            echo "未找到脚本文件！" && exit 1
          fi

      - name: 自动提交并推送更新后的 Excel 文件
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add *.xlsx *.csv || true
          git commit -m "Auto update daily report [skip ci]" || exit 0
          git push
